name: Build Android APK (development only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install FuelTill dependencies
        run: npm ci
      - name: Run application tests
        run: npm test
      - name: Build mobile web bundle
        run: npm run build -- --base=./
      - name: Install native Capacitor toolchain (CI only)
        run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android web assets
        run: npx cap sync android
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"
          "$SDK_MANAGER" --list_installed
      - name: Build unsigned-for-production debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: FuelTill-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
